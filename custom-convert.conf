# PlayDSD: transcoding of dsf and dff files using ffmpeg.
#
# Core only streams DSD natively (dsf to dsf, dff to dff) to players that
# support it. These rules convert DSD to PCM, FLAC or MP3 for the others.
#
# ffmpeg decodes DSD to 24 bit PCM. The output rate defaults to 176400 Hz and
# is replaced by the rate the player allows when one is requested ($RESAMPLE$).
# MP3 is always resampled to 44100 Hz, or lower if the player requires it.
# The ffmpeg binary must be known to the server.

dsf pcm * *
	# FT:{START=-ss %s}D:{RESAMPLE=-ar %d}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -ar 176400 $RESAMPLE$ -f s24le -acodec pcm_s24le -

dsf flc * *
	# FT:{START=-ss %s}D:{RESAMPLE=-ar %d}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -ar 176400 $RESAMPLE$ -sample_fmt s32 -bits_per_raw_sample 24 -compression_level 0 -f flac -

dsf mp3 * *
	# FT:{START=-ss %s}B:{BITRATE=--abr %B}D:{RESAMPLE=-ar %d}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -ar 44100 $RESAMPLE$ -f wav -acodec pcm_s16le - | [lame] --silent -q $QUALITY$ $BITRATE$ - -

dff pcm * *
	# FT:{START=-ss %s}D:{RESAMPLE=-ar %d}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -ar 176400 $RESAMPLE$ -f s24le -acodec pcm_s24le -

dff flc * *
	# FT:{START=-ss %s}D:{RESAMPLE=-ar %d}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -ar 176400 $RESAMPLE$ -sample_fmt s32 -bits_per_raw_sample 24 -compression_level 0 -f flac -

dff mp3 * *
	# FT:{START=-ss %s}B:{BITRATE=--abr %B}D:{RESAMPLE=-ar %d}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -vn -ar 44100 $RESAMPLE$ -f wav -acodec pcm_s16le - | [lame] --silent -q $QUALITY$ $BITRATE$ - -
